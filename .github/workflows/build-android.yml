name: Build Android APK

on:
  workflow_dispatch:
  push:
    paths:
      - "android/**"
      - "client/**"
      - "vercel.json"
      - ".github/workflows/build-android.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Build the shared web frontend for Android
        env:
          VERCEL: "1"
          VITE_CAREWELL_DATA_MODE: api
          VITE_API_BASE_URL: /api/v1
          VITE_API_SEND_CREDENTIALS: "true"
          VITE_ADMIN_LOGIN_PATH: "#/staff-1164ab636c75"
        run: |
          npm ci --prefix client
          npm --prefix client run build
          mkdir -p android/app/src/main/assets/web
          cp -R client/dist/. android/app/src/main/assets/web/

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android build tools
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.9"

      - name: Build debug APK
        working-directory: android
        run: gradle assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: carewell-android-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
